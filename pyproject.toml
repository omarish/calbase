[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calbase"
version = "0.1.0"
description = "Like git rebase -i, for your Google Calendar"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Omar Bohsali" },
]
keywords = ["calendar", "google-calendar", "cli", "git-rebase", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "dateparser>=1.2.2",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "typer",
]

[project.urls]
Homepage = "https://github.com/omarish/calbase"
Repository = "https://github.com/omarish/calbase"
Issues = "https://github.com/omarish/calbase/issues"

[project.scripts]
calbase = "calbase.cli:main"
cb = "calbase.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["calbase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
